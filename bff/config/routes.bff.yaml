# Lista blanca de lo que el navegador puede pedir. Lo que no está aquí devuelve 404.
#
# Campos por ruta:
#   id               nombre estable (logs, métricas)
#   method / path    ruta pública bajo /bff/v1. Admite {parametros}.
#   upstream.action  nombre de la acción en tmwe_json (?action=...)
#   upstream.method  método hacia el backend si difiere del público
#   upstream.query   parámetros fijos
#   upstream.params  {segmento: parametro_upstream} para los {parametros} de la ruta
#   upstream.forward_query  parámetros de query que se reenvían tal cual
#   response         json (por defecto) | binary | stream
#   legacy_envelope  true si el controlador responde 200 con {"success": false}
#   limits           body (p. ej. 64k, 20m) y timeout en segundos
#   csrf             por defecto true para métodos que cambian estado
# Rutas de la SPA (módulos cargo y shipment), generadas con bin/gen-spa-manifest.php.
include:
  - routes.spa.yaml

# Métodos que tmwe_json rechaza con 405 (el generador deduce de más). Sondeo: bin/probe-routes.php.
exclude:
  # partner_switch lo sustituye /bff/impersonation: el backend guarda el partner en $_SESSION
  - GET /partner_switch
  # El copilot lo llama la SPA con POST (postJson); el generador solo veía un GET
  - GET /copilot_chat
  - GET /api_copilot_elevenlabs_credential
  - POST /partner_switch
  # Revision de agentes: el controlador solo admite GET y POST con op (resto -> 405) y la SPA no usa PUT/DELETE
  - PUT /api_admin_elevenlabs_review
  - DELETE /api_admin_elevenlabs_review
  - GET /api_admin_config_section_usage
  - GET /api_admin_external_client
  - GET /api_admin_module_permissions_bulk
  - GET /api_admin_user_role_bulk
  - GET /api_anagrafica_clone
  - GET /api_anagrafica_set_default_address
  - GET /api_anagrafica_set_default_bank
  - GET /api_anagrafica_vies
  - GET /api_brt_manifest
  - GET /api_bulk_payment
  - GET /api_cargo_awb_request
  - GET /api_cargo_awb_vettori_set
  - GET /api_cargo_mawb_agent
  - GET /api_cargo_profit
  - GET /api_cargo_tact_update
  - GET /api_terminal_geocode
  - GET /rubrica_add
  - GET /unified_consolidation_quote
  - GET /unified_express_service_list_by_shipment
  - GET /unified_rate_fornitore
  - GET /web_chat_typing

routes:
  # PDF de MAWB/HAWB: el generador tarda 10-14 s en local y con el límite por defecto (15 s) daba 504 (P62).
  # Sustituye a la ruta generada de routes.spa.yaml (misma id).
  - id: get.api_awb_documents
    method: GET
    path: /api_awb_documents
    upstream:
      action: api_awb_documents
      forward_query: '*'
    limits:
      timeout: 60

  # Listados de expediciones: con algunos filtros (ciudad sobre las direcciones) la consulta pasa de 15 s y el límite
  # por defecto daba 504 intermitentes en el listado courier. Sustituyen a las rutas generadas (misma id).
  - id: get.api_courier_shipments
    method: GET
    path: /api_courier_shipments
    upstream:
      action: api_courier_shipments
      forward_query: '*'
    limits:
      timeout: 60

  - id: get.api_cargo_shipments
    method: GET
    path: /api_cargo_shipments
    upstream:
      action: api_cargo_shipments
      forward_query: '*'
    limits:
      timeout: 60

  # Consolidata: la comparación de hubs (simulador) y las acciones que cotizan en vivo (create, recalc,
  # create_from_option) u operan muchas houses (operate) tardan más de 30 s; con el límite generado daban 504
  # upstream_unreachable a los 30 s (prueba del 2026-11-05). findair les da 300 s; Apache (Timeout 300) no corta antes.
  # Sustituyen a las rutas generadas (misma id).
  - id: post.unified_consolidation_quote
    method: POST
    path: /unified_consolidation_quote
    upstream:
      action: unified_consolidation_quote
      forward_query: '*'
    limits:
      body: 1m
      timeout: 300

  - id: post.unified_consolidation_project
    method: POST
    path: /unified_consolidation_project
    upstream:
      action: unified_consolidation_project
      forward_query: '*'
    limits:
      body: 1m
      timeout: 300

  # Estados de tracking para el diálogo «Estado y actividad» del detalle courier (antes 404: el generador no ve
  # nombres con guiones y el desplegable mostraba el código en crudo).
  - id: get.get-tracking-status-list
    method: GET
    path: /get-tracking-status-list
    upstream:
      action: get-tracking-status-list
      forward_query: '*'

  # Catálogos públicos del backend (public_oauth: cualquier Bearer válido, sin módulo master_data). El generador no los
  # ve porque su nombre lleva guiones. Los usan los desplegables de país y moneda de cualquier perfil, partner incluido;
  # api_master_countries / api_master_currencies quedan para el mantenimiento (internos). Solo columnas públicas.
  - id: get.get-api-countries
    method: GET
    path: /get-api-countries
    upstream:
      action: get-api-countries
      forward_query: '*'
    # Country_Controller es público (is_secured() = false): no autentica, así que no emite X-Effective-Partner-Id y,
    # suplantando, la comprobación daba 502 effective_partner_mismatch en /clients. El catálogo de países es global,
    # el mismo para todos los partners: no hay datos de otro partner que proteger.
    check_effective_partner: false

  - id: get.get-api-currencies
    method: GET
    path: /get-api-currencies
    upstream:
      action: get-api-currencies
      forward_query: '*'

  # "Nueva expedición" crea con POST /unified_shipment a través de useEntityCreate, que recibe el
  # endpoint como parámetro: el generador no lo ve y solo emite el GET. Mismo límite que
  # post.unified_cargo_shipment.
  - id: post.unified_shipment
    method: POST
    path: /unified_shipment
    upstream:
      action: unified_shipment
      forward_query: '*'
    limits: { body: 1m, timeout: 30 }

  # Reenvio del enlace de acceso a un contacto (P38/H4). Es una ruta nueva del API: el generador la
  # incorporara al regenerar el manifiesto contra un tmwe_api que ya la tenga; esta entrada manual
  # la sustituye entonces (mismo metodo y ruta).
  - id: post.api_contact_access_link
    method: POST
    path: /api_contact_access_link
    upstream:
      action: api_contact_access_link
    limits: { body: 1m, timeout: 30 }

  - id: me.profile
    method: GET
    path: /me
    upstream:
      action: get_my_profile
    legacy_envelope: true

  # Ejemplos de nivel api con Bearer puro (rutas reales de config/routes del backend):
  - id: currency.day
    method: GET
    path: /currencies/day
    upstream:
      action: api_currency_day
      forward_query: [currency, date]

  # Latido de presencia. El aviso al cerrar pestaña no puede llevar X-CSRF-Token, así que se
  # confía en OriginMiddleware (Origin / Sec-Fetch-Site), que sigue activo para métodos no seguros.
  - id: presence.heartbeat
    method: POST
    path: /web_presence_heartbeat
    csrf: false
    upstream:
      action: web_presence_heartbeat
    limits: { body: 4k, timeout: 5 }

  - id: admin.my_permissions
    method: GET
    path: /api_admin_my_permissions
    upstream:
      action: api_admin_my_permissions

  # Responde en ~10 s (hasta 40 s bajo carga): el margen por defecto de 15 s da 504.
  - id: home.box_indicators
    method: GET
    path: /api_home_box_indicators
    upstream:
      action: api_home_box_indicators
      forward_query: '*'
    limits: { timeout: 45 }

  # Contadores de la home (courier y cargo): con la caché del API fría (primera visita del día o dato de más de 1 h)
  # el cálculo de TMWE tarda unos 16 s sin carga y 30-80 s con ella; el límite por defecto (15 s) daba 504 intermitentes.
  # Sustituyen a las rutas generadas de routes.spa.yaml (misma id).
  - id: get.api_courier_kpis
    method: GET
    path: /api_courier_kpis
    upstream:
      action: api_courier_kpis
      forward_query: '*'
    limits: { timeout: 60 }

  - id: get.api_cargo_kpis
    method: GET
    path: /api_cargo_kpis
    upstream:
      action: api_cargo_kpis
      forward_query: '*'
    limits: { timeout: 60 }

  # --- Sesiones abiertas con un OTP (sin usuario) --------------------------------------------------------------
  # La aerolínea que responde a una cotización cargo no tiene usuario: el OTP del correo autoriza el acceso a ESA oferta
  # (POST /bff/auth/otp) y la aplicación se autentica ante el API con su propio Bearer. Estas rutas las atiende SOLO una
  # sesión de OTP del tipo indicado (`otp:`); id y OTP salen de la concesión de la sesión, no del navegador, así que no
  # hay `forward_query`. Una sesión de usuario no llega aquí y una de OTP no llega a ninguna otra ruta.
  - id: otp.cargo_offer.view
    method: GET
    path: /api_carrier_offer
    upstream:
      action: api_carrier_offer
    otp: cargo_offer
    check_effective_partner: false
    limits: { timeout: 20 }

  # La aerolínea envía su respuesta (precio por línea, peso tasable, notas, horario, referencia y la confirmación). Cuerpo JSON
  # pequeño; el total lo calcula el API. Límite propio por sesión e IP. El CSRF es el de la sesión de OTP.
  - id: otp.cargo_offer.submit
    method: POST
    path: /api_carrier_offer
    upstream:
      action: api_carrier_offer
    otp: cargo_offer
    check_effective_partner: false
    limits: { body: 32k, timeout: 20 }
    throttle: otp_submit

  # Solicitud de cotización de una expedición courier vista y respondida por un courier o una anagrafica partner (sesión OTP
  # `courier_offer`). Misma forma que la de cargo: el API calcula/valida en el servidor y la respuesta es única.
  - id: otp.courier_offer.view
    method: GET
    path: /api_courier_offer
    upstream:
      action: api_courier_offer
    otp: courier_offer
    check_effective_partner: false
    limits: { timeout: 20 }

  - id: otp.courier_offer.submit
    method: POST
    path: /api_courier_offer
    upstream:
      action: api_courier_offer
    otp: courier_offer
    check_effective_partner: false
    limits: { body: 16k, timeout: 20 }
    throttle: otp_submit

  # Ficheros de la aerolínea (sesión OTP): descargar uno de la expedición (`idf`) o uno suyo (`n`), y subir el suyo (multipart, máx. 4 MB).
  - id: otp.cargo_offer.file.download
    method: GET
    path: /api_carrier_offer_file
    upstream:
      action: api_carrier_offer_file
      forward_query: [idf, n]
    response: binary
    otp: cargo_offer
    check_effective_partner: false
    limits: { timeout: 30 }

  - id: otp.cargo_offer.file.upload
    method: POST
    path: /api_carrier_offer_file
    upstream:
      action: api_carrier_offer_file
    otp: cargo_offer
    multipart: true
    check_effective_partner: false
    limits: { body: 4m, timeout: 30 }
    throttle: otp_upload

  # CSV de bultos y constancia en PDF; el POST del PDF la manda por correo al contacto registrado de la aerolínea (no se elige el destinatario).
  - id: otp.cargo_offer.packages
    method: GET
    path: /api_carrier_offer_packages
    upstream:
      action: api_carrier_offer_packages
    response: binary
    otp: cargo_offer
    check_effective_partner: false
    limits: { timeout: 20 }

  - id: otp.cargo_offer.pdf.download
    method: GET
    path: /api_carrier_offer_pdf
    upstream:
      action: api_carrier_offer_pdf
    response: binary
    otp: cargo_offer
    check_effective_partner: false
    limits: { timeout: 45 }

  - id: otp.cargo_offer.pdf.mail
    method: POST
    path: /api_carrier_offer_pdf
    upstream:
      action: api_carrier_offer_pdf
    otp: cargo_offer
    check_effective_partner: false
    limits: { body: 1k, timeout: 45 }
    throttle: otp_mail

  # Copilot del ERP: la SPA usa postJson() (método dinámico), que el generador no detecta.
  - id: copilot.chat
    method: POST
    path: /copilot_chat
    upstream:
      action: copilot_chat
    limits: { body: 1m, timeout: 120 }
    # 1 chat simultáneo por usuario, tope global y ritmo por minuto (contadores atómicos en Valkey; ver Settings).
    throttle: copilot_chat

  # Confirmación de una propuesta de escritura del copilot (contrato: tmwe_json Copilot_Write_Proposal_Controller).
  # Solo se expone op=confirmar: op=proponer permitiría fabricar propuestas desde el navegador saltándose
  # el modelo, copilot_write_enabled y la auditoría de la propuesta (las propuestas se firman en copilot_chat).
  # Sin legacy_envelope: los rechazos son HTTP 4xx/5xx con {success:false,error}; un 200 con
  # executed:false es un rechazo del ERP y lo interpreta la SPA. Tier oauth_external: Bearer, sin hermano de sesión.
  - id: copilot.write_proposal
    method: POST
    path: /api_copilot_write_proposal
    upstream:
      action: api_copilot_write_proposal
    limits: { body: 64k, timeout: 30 }
    body_enum:
      op: [confirmar]
    throttle: copilot_confirm

  # TTS del copilot: devuelve audio/mpeg (la SPA lo pide con POST y responseType blob).
  # Fijado a mano para no depender del generado; bin/gen-spa-manifest.php lo regenera igual y esta entrada gana.
  - id: copilot.tts
    method: POST
    path: /copilot_tts
    upstream:
      action: copilot_tts
    response: binary
    limits: { body: 1m, timeout: 30 }

  - id: copilot.elevenlabs_credential
    method: POST
    path: /api_copilot_elevenlabs_credential
    upstream:
      action: api_copilot_elevenlabs_credential
    limits: { body: 64k, timeout: 30 }

  # QR de login: el escritorio (con Bearer) genera un QR y el móvil abre sesión al escanearlo. El destino del móvil
  # se informa aquí ({client_id, redirect} o {return_to}); tmwe_api lo valida al generar (origen registrado del client).
  - id: qr_login.generate
    method: POST
    path: /api_qr_login_generate
    upstream:
      action: api_qr_login_generate
    limits: { body: 4k, timeout: 30 }

  # Administración de IA (contrato ai-admin/1, docs/06-api/agentes-ia/10-contrato-ai-admin.md en tmwe_json).
  # Los scopes (ai:admin, ai:audit:read, ai:memory:erase) los aplica la API; el BFF solo abre la lista blanca.
  # Los métodos que cambian estado llevan CSRF por defecto.
  - id: ai_admin.settings.get
    method: GET
    path: /api_admin_ai_settings
    upstream:
      action: api_admin_ai_settings
      forward_query: [partner_id]

  - id: ai_admin.settings.put
    method: PUT
    path: /api_admin_ai_settings
    upstream:
      action: api_admin_ai_settings
    limits: { body: 16k, timeout: 15 }

  - id: ai_admin.budgets.get
    method: GET
    path: /api_admin_ai_budgets
    upstream:
      action: api_admin_ai_budgets
      forward_query: [partner_id]

  - id: ai_admin.budgets.put
    method: PUT
    path: /api_admin_ai_budgets
    upstream:
      action: api_admin_ai_budgets
    limits: { body: 16k, timeout: 15 }

  - id: ai_admin.budgets.delete
    method: DELETE
    path: /api_admin_ai_budgets
    upstream:
      action: api_admin_ai_budgets
      forward_query: [id]

  # «Mis credenciales de IA»: un partner gestiona SU clave (el servidor fija el partner; la API nunca
  # devuelve la clave). TMWE sigue usando /api_admin_ai_credentials.
  - id: ai_admin.my_credentials.get
    method: GET
    path: /api_admin_ai_my_credentials
    upstream:
      action: api_admin_ai_my_credentials

  - id: ai_admin.my_credentials.post
    method: POST
    path: /api_admin_ai_my_credentials
    upstream:
      action: api_admin_ai_my_credentials
    limits: { body: 16k, timeout: 15 }

  - id: ai_admin.my_credentials.put
    method: PUT
    path: /api_admin_ai_my_credentials
    upstream:
      action: api_admin_ai_my_credentials
    limits: { body: 16k, timeout: 15 }

  - id: ai_admin.my_credentials.delete
    method: DELETE
    path: /api_admin_ai_my_credentials
    upstream:
      action: api_admin_ai_my_credentials
      forward_query: [id]

  - id: ai_admin.usage.get
    method: GET
    path: /api_admin_ai_usage
    upstream:
      action: api_admin_ai_usage
      forward_query: [from, to, partner_id, feature, group_by]
    limits: { timeout: 30 }

  - id: ai_admin.audit.get
    method: GET
    path: /api_admin_ai_audit
    upstream:
      action: api_admin_ai_audit
      forward_query: [partner_id, feature, event, status, from, to, limit, cursor]
    limits: { timeout: 30 }

  - id: ai_admin.copilot_memory.get
    method: GET
    path: /api_admin_copilot_memory
    upstream:
      action: api_admin_copilot_memory
      forward_query: [user_id, limit, cursor]

  - id: ai_admin.copilot_memory.delete
    method: DELETE
    path: /api_admin_copilot_memory
    upstream:
      action: api_admin_copilot_memory
      forward_query: [user_id, id]

  # live=1 hace que la API consulte a ElevenLabs: puede tardar.
  - id: ai_admin.elevenlabs_health.get
    method: GET
    path: /api_admin_elevenlabs_health
    upstream:
      action: api_admin_elevenlabs_health
      forward_query: [live]
    limits: { timeout: 30 }

  # Mercancía peligrosa: contacto de emergencia 24 h y firmante del partner. GET: el del partner de la sesión (TMWE
  # puede pedir otro con anagrafica_id); POST: TMWE o administrador del partner (partner:manage), lo aplica la API.
  - id: partner_dgr_config.get
    method: GET
    path: /api_partner_dgr_config
    upstream:
      action: api_partner_dgr_config
      forward_query: [anagrafica_id]

  - id: partner_dgr_config.post
    method: POST
    path: /api_partner_dgr_config
    upstream:
      action: api_partner_dgr_config
      forward_query: [anagrafica_id]
    limits: { body: 16k, timeout: 30 }

  # Cuentas SMTP por partner. api_partner_smtp: el administrador del partner gestiona las suyas (el partner sale
  # de la sesión, nunca del cliente); api_admin_partner_smtp: TMWE sobre cualquier partner. Scopes smtp:read/write y
  # "administrador del partner" los aplica la API. POST puede ser {action:'test'}: abre una conexión SMTP real.
  - id: partner_smtp.get
    method: GET
    path: /api_partner_smtp
    upstream:
      action: api_partner_smtp
      forward_query: [id, view, purpose, environment, from]

  - id: partner_smtp.post
    method: POST
    path: /api_partner_smtp
    upstream:
      action: api_partner_smtp
    limits: { body: 16k, timeout: 30 }

  - id: partner_smtp.put
    method: PUT
    path: /api_partner_smtp
    upstream:
      action: api_partner_smtp
    limits: { body: 16k, timeout: 15 }

  - id: partner_smtp.delete
    method: DELETE
    path: /api_partner_smtp
    upstream:
      action: api_partner_smtp
    limits: { body: 4k, timeout: 15 }

  - id: admin_partner_smtp.get
    method: GET
    path: /api_admin_partner_smtp
    upstream:
      action: api_admin_partner_smtp
      forward_query: [id, anagrafica_id, view, purpose, environment, from]

  - id: admin_partner_smtp.post
    method: POST
    path: /api_admin_partner_smtp
    upstream:
      action: api_admin_partner_smtp
    limits: { body: 16k, timeout: 30 }

  - id: admin_partner_smtp.put
    method: PUT
    path: /api_admin_partner_smtp
    upstream:
      action: api_admin_partner_smtp
    limits: { body: 16k, timeout: 15 }

  - id: admin_partner_smtp.delete
    method: DELETE
    path: /api_admin_partner_smtp
    upstream:
      action: api_admin_partner_smtp
    limits: { body: 4k, timeout: 15 }

  # Pasarelas de pago. api_pay_gateway_accounts: cada partner gestiona SUS cuentas (el partner sale del token, nunca del
  # cliente; una cuenta ajena responde 404). POST puede ser {action:'rotate_secret'|'validate'}: validate llama al
  # proveedor. secret y webhook_secret son de solo escritura: la API nunca los devuelve (solo secret_hint).
  # api_admin_pay_gateway_accounts: TMWE, solo lectura. api_pay_refunds: solicitud y aprobacion por una segunda persona
  # ({action:'approve'|'reject'}); POST llama al proveedor. api_pay_payments: cobro de facturas con Checkout alojado de
  # Stripe. GET = detalle (?id=) o listado paginado (?invoice_id=, ?status=); POST crea la sesion y responde 202 con
  # checkout_url (201 si ya estaba cobrado). Nunca hay client_secret en modo hosted; los errores 402/409/422/503 (incl.
  # PAYMENT_GATEWAYS_NOT_ACTIVE) pasan intactos. La autoridad del estado es el webhook, no el retorno del navegador.
  # api_pay_pending_invoices: facturas pendientes de cobro (solo lectura, paginadas por vencimiento). Personal y partner
  # necesitan invoices:read + payment_gateways:read; sin permiso responde 403 y ante un fallo de lectura 503
  # PAYMENT_PENDING_UNAVAILABLE (nunca una lista vacia): ambos pasan intactos con su code. Solo GET, sin cuerpo ni CSRF; el
  # cliente/partner sale del token, por eso solo se reenvian page y per_page (nada de partner_id, customer_id, etc.).
  - id: pay_gateway_accounts.get
    method: GET
    path: /api_pay_gateway_accounts
    upstream:
      action: api_pay_gateway_accounts
      forward_query: [id, environment]

  - id: pay_gateway_accounts.post
    method: POST
    path: /api_pay_gateway_accounts
    upstream:
      action: api_pay_gateway_accounts
    limits: { body: 16k, timeout: 30 }

  - id: pay_gateway_accounts.put
    method: PUT
    path: /api_pay_gateway_accounts
    upstream:
      action: api_pay_gateway_accounts
    limits: { body: 16k, timeout: 15 }

  - id: pay_gateway_accounts.delete
    method: DELETE
    path: /api_pay_gateway_accounts
    upstream:
      action: api_pay_gateway_accounts
    limits: { body: 4k, timeout: 15 }

  - id: admin_pay_gateway_accounts.get
    method: GET
    path: /api_admin_pay_gateway_accounts
    upstream:
      action: api_admin_pay_gateway_accounts
      forward_query: [partner_id, environment, provider, status]

  - id: pay_refunds.get
    method: GET
    path: /api_pay_refunds
    upstream:
      action: api_pay_refunds
      forward_query: [id, view]

  - id: pay_refunds.post
    method: POST
    path: /api_pay_refunds
    upstream:
      action: api_pay_refunds
    limits: { body: 4k, timeout: 30 }

  - id: pay_payments.get
    method: GET
    path: /api_pay_payments
    upstream:
      action: api_pay_payments
      forward_query: [id, invoice_id, status]

  - id: pay_payments.post
    method: POST
    path: /api_pay_payments
    upstream:
      action: api_pay_payments
    limits: { body: 4k, timeout: 30 }

  - id: pay_pending_invoices.get
    method: GET
    path: /api_pay_pending_invoices
    upstream:
      action: api_pay_pending_invoices
      forward_query: [page, per_page]

  # Autorizaciones de cobro del cliente y recargos (Ola 3 / F-C de pagos). Contrato en docs/contrato-con-api.md.
  # api_pay_authorizations: permiso que firma el cliente (una vez) para que el vendedor le cobre despues recargos.
  # GET = texto de consentimiento (?view=consent_text&locale=), detalle (?id=pau_...) o listado paginado (?status=,
  # ?customer_id=, ?page=, ?per_page=). POST sin action = alta (Checkout `setup` alojado: 201 con checkout_url, o 200
  # replayed:true sin checkout_url); POST {action:'revoke', id} = revocar. La IP, el user agent y la persona de la
  # prueba del consentimiento los pone el servidor, nunca el cuerpo. El estado pasa a `active` solo por webhook: la SPA
  # sondea el GET. 503 PAYMENT_NOT_ACTIVE (interruptor apagado) y PAYMENT_RETURN_URL_NOT_CONFIGURED pasan intactos.
  # api_pay_surcharges: recargos por sobrepeso/oversize/otros. GET = detalle (?id=psu_...), listado paginado (?status=,
  # ?customer_id=, ?page=, ?per_page=) o ?view=pending_transfer (cobrados por TMWE como respaldo a favor del partner y
  # aun sin transferir; solo datos). POST sin action = proponer; POST {action: notify|dispute|waive|reject_dispute|charge,
  # id, reason?}. waive/reject_dispute/charge exigen payment_gateways:admin + (TMWE o partner:manage); un recargo de otro
  # partner responde 404 incluso a TMWE (independencia del partner): el BFF no ofrece vista cruzada ni reenvia partner_id.
  # El partner y el actor salen SIEMPRE del token. Los errores 4xx (404/409/422/403) conservan estado y code por el camino
  # normal; los 503 PAYMENT_NOT_ACTIVE se tratan en ResponseAdapter::paymentProblem.
  - id: pay_authorizations.get
    method: GET
    path: /api_pay_authorizations
    upstream:
      action: api_pay_authorizations
      forward_query: [id, view, locale, status, customer_id, page, per_page]

  - id: pay_authorizations.post
    method: POST
    path: /api_pay_authorizations
    upstream:
      action: api_pay_authorizations
    limits: { body: 4k, timeout: 30 }

  - id: pay_surcharges.get
    method: GET
    path: /api_pay_surcharges
    upstream:
      action: api_pay_surcharges
      forward_query: [id, view, status, customer_id, page, per_page]

  - id: pay_surcharges.post
    method: POST
    path: /api_pay_surcharges
    upstream:
      action: api_pay_surcharges
    limits: { body: 16k, timeout: 30 }

  # Clientes sin margen configurado (P91). Añadida a mano: no regenerar el manifiesto (quita rutas en uso).
  # Mismo modelo que get.api_anagrafica_scaglioni (routes.spa.yaml): el BFF solo deja pasar; el API autoriza con el
  # módulo margenes_clientes (margins:read) y acota por partner (TMWE todos; partner solo id_anagr_titolare = el suyo).
  # id_titolare solo lo atiende el API para TMWE.
  - id: get.api_customers_without_margin
    method: GET
    path: /api_customers_without_margin
    upstream:
      action: api_customers_without_margin
      forward_query: [tipo, q, page, per_page, id_titolare]

  # Aplicar en bloque el preset base del titular a clientes sin margen (P92). Módulo margenes_clientes,
  # margins:write; el API usa el preset del titular de cada cliente y un partner solo toca los suyos.
  - id: post.api_customers_without_margin
    method: POST
    path: /api_customers_without_margin
    upstream:
      action: api_customers_without_margin
    limits: { body: 64k, timeout: 60 }

  # Fichero de la etiqueta del courier (y documentos auxiliares: factura comercial...) de una expedicion. La SPA lo
  # pide por aqui y no por la URL absoluta del API que devuelve get_label_courier_shipment: desde el ERP el navegador
  # no lleva sesion ni token al host del API (401 public_route_unauthenticated_call, 1001084298, 2026-11-07). El API
  # comprueba el acceso a la expedicion (titular del cliente, compartida, cliente, cuenta courier del partner).
  # format=image|pdf convierte con el worker image_converter: timeout holgado.
  - id: get.get_label_file
    method: GET
    path: /get_label_file
    upstream:
      action: get_label_file
      forward_query: [shipment_id, package_number, format]
    response: binary
    limits: { timeout: 60 }

  - id: get.get_label_auxiliar_file
    method: GET
    path: /get_label_auxiliar_file
    upstream:
      action: get_label_auxiliar_file
      forward_query: [shipment_id, package_number, auxiliar_number, format, control]
    response: binary
    limits: { timeout: 60 }

  # Reserva y anulación de vuelos (KLM y WebCargo): la API espera al carrier hasta 50 s (KLM) o 35 s + 35 s de
  # consulta de estado (WebCargo). Con 30 s el BFF cortaba antes y la SPA veía un fallo mientras la operación seguía
  # por detrás. Sustituyen a las rutas generadas (misma id).
  - id: post.api_cargo_klm_booking
    method: POST
    path: /api_cargo_klm_booking
    upstream:
      action: api_cargo_klm_booking
      forward_query: '*'
    limits: { body: 1m, timeout: 120 }

  - id: post.api_cargo_klm_booking_cancel
    method: POST
    path: /api_cargo_klm_booking_cancel
    upstream:
      action: api_cargo_klm_booking_cancel
      forward_query: '*'
    limits: { body: 1m, timeout: 120 }

  # Búsqueda de vuelos asíncrona (api/docs/03-diseno/cargo_rate_latencia/PLAN_BUSQUEDA_ASINCRONA.md): peticiones
  # cortas en lugar del stream, que ocupaba un worker del BFF toda la búsqueda. El stream
  # (post.api_cargo_shipment_flight_search) no cambia y es la vuelta atrás si el API responde 503.
  - id: post.api_cargo_rate_search
    method: POST
    path: /api_cargo_rate_search
    upstream:
      action: api_cargo_rate_search
      forward_query: '*'
    limits: { body: 64k, timeout: 15 }

  - id: get.api_cargo_rate_search_events
    method: GET
    path: /api_cargo_rate_search_events
    upstream:
      action: api_cargo_rate_search_events
      forward_query: [search_id, since]
    limits: { timeout: 15 }
    throttle: rate_search_poll

  - id: get.api_cargo_rate_search_result
    method: GET
    path: /api_cargo_rate_search_result
    upstream:
      action: api_cargo_rate_search_result
      forward_query: [search_id]
    limits: { timeout: 15 }
    throttle: rate_search_poll

  - id: post.api_cargo_rate_search_cancel
    method: POST
    path: /api_cargo_rate_search_cancel
    upstream:
      action: api_cargo_rate_search_cancel
      forward_query: [search_id]
    limits: { body: 4k, timeout: 15 }

  - id: post.api_cargo_webcargo_booking
    method: POST
    path: /api_cargo_webcargo_booking
    upstream:
      action: api_cargo_webcargo_booking
      forward_query: '*'
    limits: { body: 1m, timeout: 120 }

  - id: post.api_cargo_webcargo_booking_cancel
    method: POST
    path: /api_cargo_webcargo_booking_cancel
    upstream:
      action: api_cargo_webcargo_booking_cancel
      forward_query: '*'
    limits: { body: 1m, timeout: 120 }

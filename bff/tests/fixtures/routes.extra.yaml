routes:
  - id: spa.list
    method: GET
    path: /api_spa_list
    upstream:
      action: api_spa_list
      forward_query: '*'
  - id: spa.generated.heartbeat
    method: POST
    path: /things
    upstream:
      action: generated_version
  - id: spa.book.read
    method: GET
    path: /api_spa_book
    upstream: { action: api_spa_book }
  - id: spa.book.create
    method: POST
    path: /api_spa_book
    upstream: { action: api_spa_book }
  - id: spa.thing.cancel
    method: DELETE
    path: /api_thing_cancel
    upstream: { action: api_thing_cancel }
  - id: spa.stream
    method: GET
    path: /api_spa_stream
    response: stream
    upstream: { action: api_spa_stream, forward_query: '*' }
    limits: { timeout: 120 }

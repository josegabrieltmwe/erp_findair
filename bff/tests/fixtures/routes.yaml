routes:
  - id: thing.show
    method: GET
    path: /things/{id}
    upstream:
      action: api_thing
      params: { id: thing_id }
      forward_query: [lang]
  - id: thing.nocheck
    method: GET
    path: /nocheck
    upstream:
      action: api_nocheck
    check_effective_partner: false
  - id: thing.create
    method: POST
    path: /things
    upstream:
      action: api_thing_create
    limits: { body: 1k }
  - id: thing.legacy
    method: GET
    path: /legacy
    upstream:
      action: legacy_thing
    legacy_envelope: true
  - id: chat.send
    method: POST
    path: /chat
    upstream:
      action: api_chat
    limits: { body: 1k, timeout: 20 }
    throttle: copilot_chat
  - id: copilot.chat
    method: POST
    path: /copilot_chat
    upstream:
      action: copilot_chat
    limits: { body: 1k }
  - id: chat.confirm
    method: POST
    path: /confirm
    upstream:
      action: api_confirm
    limits: { body: 1k }
    body_enum:
      op: [confirmar]
    throttle: copilot_confirm
  - id: chat.big
    method: POST
    path: /bigchat
    upstream:
      action: api_bigchat
    limits: { body: 64k }
  - id: file.download
    method: GET
    path: /file
    upstream:
      action: download_file
    response: binary
include:
  - routes.extra.yaml
exclude:
  - GET /api_spa_excluded

routes:
  - id: otp.offer
    method: GET
    path: /otp_offer
    upstream:
      action: api_carrier_offer
    otp: cargo_offer
    check_effective_partner: false
  - id: thing.show
    method: GET
    path: /things/{id}
    upstream:
      action: api_thing
      params: { id: thing_id }
      forward_query: [lang]
  - id: thing.nocheck
    method: GET
    path: /nocheck
    upstream:
      action: api_nocheck
    check_effective_partner: false
  - id: thing.create
    method: POST
    path: /things
    upstream:
      action: api_thing_create
    limits: { body: 1k }
  - id: thing.legacy
    method: GET
    path: /legacy
    upstream:
      action: legacy_thing
    legacy_envelope: true
  - id: chat.send
    method: POST
    path: /chat
    upstream:
      action: api_chat
    limits: { body: 1k, timeout: 20 }
    throttle: copilot_chat
  - id: copilot.chat
    method: POST
    path: /copilot_chat
    upstream:
      action: copilot_chat
    limits: { body: 1k }
  - id: chat.confirm
    method: POST
    path: /confirm
    upstream:
      action: api_confirm
    limits: { body: 1k }
    body_enum:
      op: [confirmar]
    throttle: copilot_confirm
  - id: chat.big
    method: POST
    path: /bigchat
    upstream:
      action: api_bigchat
    limits: { body: 64k }
  - id: file.download
    method: GET
    path: /file
    upstream:
      action: download_file
    response: binary
  - id: post.full_shipment_label_generator
    method: POST
    path: /full_shipment_label_generator
    upstream:
      action: full_shipment_label_generator
    limits: { body: 1k }
  - id: pay_payments.post
    method: POST
    path: /api_pay_payments
    upstream:
      action: api_pay_payments
    limits: { body: 4k, timeout: 30 }
  - id: pay_pending_invoices.get
    method: GET
    path: /api_pay_pending_invoices
    upstream:
      action: api_pay_pending_invoices
      forward_query: [page, per_page]
  - id: pay_authorizations.get
    method: GET
    path: /api_pay_authorizations
    upstream:
      action: api_pay_authorizations
      forward_query: [id, view, locale, status, customer_id, page, per_page]
  - id: pay_authorizations.post
    method: POST
    path: /api_pay_authorizations
    upstream:
      action: api_pay_authorizations
    limits: { body: 4k, timeout: 30 }
  - id: pay_surcharges.get
    method: GET
    path: /api_pay_surcharges
    upstream:
      action: api_pay_surcharges
      forward_query: [id, view, status, customer_id, page, per_page]
  - id: pay_surcharges.post
    method: POST
    path: /api_pay_surcharges
    upstream:
      action: api_pay_surcharges
    limits: { body: 16k, timeout: 30 }
include:
  - routes.extra.yaml
exclude:
  - GET /api_spa_excluded

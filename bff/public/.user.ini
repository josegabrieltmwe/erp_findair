; Subidas de ficheros de la aerolínea (POST /bff/v1/api_carrier_offer_file): hasta 3 MB por fichero. El valor por defecto de PHP (2 MB)
; haría fallar con 413 un fichero válido. post_max_size deja margen para el multipart; el BFF reenvía solo el campo `file` y el API
; vuelve a limitar a 3 MB. Se lee en cada petición FPM (user_ini.cache_ttl, 300 s por defecto).
upload_max_filesize = 4M
post_max_size = 6M

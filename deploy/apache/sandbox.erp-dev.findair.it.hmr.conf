# sandbox.erp-dev.findair.it  --  MODO DESARROLLO CON RECARGA EN CALIENTE (HMR)
#
# Igual que sandbox.erp-dev.findair.it.conf, pero la SPA no se sirve desde
# web/dist: todo lo que no es /bff ni /loghi_partner se reenvia al servidor de
# desarrollo de Vite (127.0.0.1:5190), websocket incluido. Un cambio en un
# .vue/.ts se ve en el navegador al instante, sin `pnpm build`.
#
# Requisitos:
#   - Vite arrancado con VITE_DEV_PUBLIC_HOST=sandbox.erp-dev.findair.it
#     (servicio de usuario: deploy/systemd/erp-dev-vite.service).
#   - mod_proxy y mod_proxy_http (ya activos). Apache >= 2.4.47 hace el
#     upgrade a websocket con `upgrade=websocket`; no hace falta proxy_wstunnel.
#
# Activar / volver al bundle compilado: deploy/aplicar-apache-sandbox.sh (hmr | compilado).
#
# Si Vite esta parado, la SPA da 503; el BFF (/bff) sigue funcionando.

# ---------- HTTP: redirige a HTTPS, salvo el challenge de Let's Encrypt ----------
<VirtualHost *:80>
    ServerName sandbox.erp-dev.findair.it

    DocumentRoot /var/www/html
    <Directory /var/www/html>
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule (.*) https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]

    ErrorLog  ${APACHE_LOG_DIR}/sandbox.erp-dev.findair.it-error.log
    CustomLog ${APACHE_LOG_DIR}/sandbox.erp-dev.findair.it-access.log combined
</VirtualHost>

# ---------- HTTPS ----------
<VirtualHost *:443>
    ServerName sandbox.erp-dev.findair.it
    ServerAdmin webmaster@findair.it

    # Sin DocumentRoot util: la SPA la sirve Vite.
    DocumentRoot /var/www/html

    # --- BFF (PHP-FPM), igual que el vhost normal ---
    Alias /bff /var/www/sandbox/dev/erp_findair_dev/bff/public
    <Directory /var/www/sandbox/dev/erp_findair_dev/bff/public>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
        FallbackResource /bff/index.php
        <FilesMatch \.php$>
            SetHandler "proxy:fcgi://localhost-erp-findair"
        </FilesMatch>
    </Directory>
    <Proxy "unix:/run/php/php8.4-fpm.sock|fcgi://localhost-erp-findair">
        ProxySet flushpackets=on
    </Proxy>
    <Location "/bff/v1">
        SetEnv no-gzip 1
    </Location>

    # --- Logos de partner (partner_logo_url = /loghi_partner/logo_<id>.<ext>) ---
    Alias /loghi_partner /var/www/sandbox/dev/api_dev/storage/loghi_partner
    <Directory /var/www/sandbox/dev/api_dev/storage/loghi_partner>
        Options None
        AllowOverride None
        Require all denied
        <FilesMatch "^logo_[0-9]+\.(svg|png|jpe?g|gif)$">
            Require all granted
        </FilesMatch>
        Header set Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src data:; sandbox"
        Header set X-Content-Type-Options "nosniff"
    </Directory>

    # --- SPA: todo lo demas a Vite (HTTP + websocket del HMR) ---
    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass        /bff           !
    ProxyPass        /loghi_partner !
    ProxyPass        /  http://127.0.0.1:5190/ upgrade=websocket timeout=300
    ProxyPassReverse /  http://127.0.0.1:5190/

    # Ficheros sensibles que no deben servirse nunca por HTTP.
    <FilesMatch "^(\.env.*|composer\.(json|lock)|\.git.*)$">
        Require all denied
    </FilesMatch>

    ErrorLog  ${APACHE_LOG_DIR}/sandbox.erp-dev.findair.it-error.log
    CustomLog ${APACHE_LOG_DIR}/sandbox.erp-dev.findair.it-access.log combined

    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/sandbox.erp-dev.findair.it/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/sandbox.erp-dev.findair.it/privkey.pem
</VirtualHost>

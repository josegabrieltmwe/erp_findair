# sandbox.erp.findair.it  --  ERP Findair: SPA Vue (web/dist) + BFF Slim 4 (/bff), PHP 8.4-FPM
#
# Sirve /var/www/sandbox/erp_findair directamente como DocumentRoot de la SPA
# (igual patron que sandbox.api.findair.it), con el BFF publicado bajo /bff.
# El backend tmwe_json (sandbox) vive en https://sandbox.api.findair.it (URL
# limpia, sin /app.php; requiere una regla de rewrite adicional en el vhost
# de sandbox.api.findair.it para la raiz con ?action=, ver sesion de despliegue)
# y solo lo consume el BFF (ver bff/.env).
#
# ORDEN DE PUESTA EN MARCHA (el bloque :443 no arranca sin certificado):
#   1) sudo certbot certonly --webroot -w /var/www/html -d sandbox.erp.findair.it
#   2) sudo cp sandbox.erp.findair.it.conf /etc/apache2/sites-available/
#   3) sudo apache2ctl configtest && sudo a2ensite sandbox.erp.findair.it
#   4) sudo systemctl reload apache2
#   5) sudo apt install redis-server && sudo systemctl enable --now redis-server
#   6) Rellenar bff/.env (OAUTH_CLIENT_SECRET, confirmar redirect_uris en tmwe_json)

# ---------- HTTP: redirige a HTTPS, salvo el challenge de Let's Encrypt ----------
<VirtualHost *:80>
    ServerName sandbox.erp.findair.it

    DocumentRoot /var/www/html
    <Directory /var/www/html>
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule (.*) https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]

    ErrorLog ${APACHE_LOG_DIR}/sandbox.erp.findair.it-error.log
    CustomLog ${APACHE_LOG_DIR}/sandbox.erp.findair.it-access.log combined
</VirtualHost>

# ---------- HTTPS ----------
<VirtualHost *:443>
    ServerName sandbox.erp.findair.it
    ServerAdmin webmaster@findair.it

    DocumentRoot /var/www/sandbox/erp_findair/web/dist

    # SPA: cualquier ruta que no sea un fichero cae en index.html (history mode).
    <Directory /var/www/sandbox/erp_findair/web/dist>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
        FallbackResource /index.html
    </Directory>

    # Los estáticos que no existen deben dar 404 (no el index.html del fallback de la SPA).
    <Location "/assets">
        FallbackResource disabled
    </Location>

    # BFF: solo se publica bff/public (nunca .env, src/ ni vendor/).
    Alias /bff /var/www/sandbox/erp_findair/bff/public
    <Directory /var/www/sandbox/erp_findair/bff/public>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.php

        <FilesMatch \.php$>
            SetHandler "proxy:fcgi://localhost-erp-findair-live"
        </FilesMatch>
        FallbackResource /bff/index.php
    </Directory>

    # PHP-FPM 8.4, con flushpackets para no romper las SSE del manifiesto
    # (mod_proxy_fcgi bufferiza la respuesta hasta que el script termina).
    <Proxy "unix:/run/php/php8.4-fpm.sock|fcgi://localhost-erp-findair-live">
        ProxySet flushpackets=on
    </Proxy>

    # Sin buffering para los streams SSE del manifiesto (response: stream).
    <Location "/bff/v1">
        SetEnv no-gzip 1
    </Location>

    # Ficheros sensibles que no deben servirse nunca por HTTP (defensa en profundidad).
    <FilesMatch "^(\.env.*|composer\.(json|lock)|\.git.*)$">
        Require all denied
    </FilesMatch>
    <DirectoryMatch "/\.git">
        Require all denied
    </DirectoryMatch>

    # SSL - Let's Encrypt
    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/sandbox.erp.findair.it/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/sandbox.erp.findair.it/privkey.pem

    ErrorLog ${APACHE_LOG_DIR}/sandbox.erp.findair.it-error.log
    CustomLog ${APACHE_LOG_DIR}/sandbox.erp.findair.it-access.log combined
</VirtualHost>

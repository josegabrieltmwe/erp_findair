# ERP Findair — SPA Vue (web/dist) + BFF Slim 4 (/bff) en el mismo origen.
# Plantilla: deploy/apache/install.sh sustituye @ROOT@ por la raíz real del proyecto.
# Apache usa mod_php 8.5; el BFF exige PHP >= 8.3. El backend tmwe_json vive en
# https://tmwe-api.php7 (PHP 7.4 por FPM) y solo lo consume el BFF.

<VirtualHost *:80>
    ServerName erp-findair.php8
    ServerAlias www.erp-findair.php8
    Redirect permanent / https://erp-findair.php8/
</VirtualHost>

<VirtualHost *:443>
    ServerName erp-findair.php8
    ServerAlias www.erp-findair.php8
    DocumentRoot @ROOT@/web/dist

    SSLEngine on
    SSLCertificateFile    /etc/apache2/ssl/erp-findair.php8.pem
    SSLCertificateKeyFile /etc/apache2/ssl/erp-findair.php8-key.pem

    # SPA: cualquier ruta que no sea un fichero cae en index.html (history mode).
    <Directory @ROOT@/web/dist>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
        FallbackResource /index.html
    </Directory>

    # Los estáticos que no existen deben dar 404 (no el index.html del fallback de la SPA).
    <Location "/assets">
        FallbackResource disabled
    </Location>

    # BFF: solo se publica bff/public (nunca .env, src/ ni vendor/).
    Alias /bff @ROOT@/bff/public
    <Directory @ROOT@/bff/public>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
        FallbackResource /bff/index.php
    </Directory>

    # Sin buffering para los streams SSE del manifiesto (response: stream).
    <Location "/bff/v1">
        SetEnv no-gzip 1
    </Location>

    ErrorLog  ${APACHE_LOG_DIR}/erp-findair.php8-error.log
    CustomLog ${APACHE_LOG_DIR}/erp-findair.php8-access.log combined
</VirtualHost>

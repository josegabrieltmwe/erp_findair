# sandbox.erp-dev.findair.it  --  SPA Vue (web/dist) + BFF Slim 4 (/bff) en el
# mismo origen. Apache usa PHP-FPM 8.4 (el BFF exige PHP >= 8.3). El backend
# tmwe_json vive en https://sandbox.api-dev.findair.it/erp/tmwe_json/ y solo
# lo consume el BFF (UPSTREAM_BASE_URL en bff/.env).
#
# ORDEN DE PUESTA EN MARCHA (el bloque :443 no arranca sin certificado):
#   1) sudo apt install redis-server && sudo systemctl enable --now redis-server
#   2) sudo cp deploy/apache/sandbox.erp-dev.findair.it.conf /etc/apache2/sites-available/
#   3) sudo a2ensite sandbox.erp-dev.findair.it
#   4) sudo apache2ctl configtest && sudo systemctl reload apache2
#   5) sudo certbot certonly --webroot -w /var/www/html -d sandbox.erp-dev.findair.it
#   6) sudo systemctl reload apache2   (activa ya el bloque :443 de abajo)

# ---------- HTTP: redirige a HTTPS, salvo el challenge de Let's Encrypt ----------
<VirtualHost *:80>
    ServerName sandbox.erp-dev.findair.it

    # El challenge ACME tiene que responder por HTTP en claro; si lo
    # redirigimos, la renovación falla cuando el certificado ya ha caducado.
    DocumentRoot /var/www/html
    <Directory /var/www/html>
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule (.*) https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]

    ErrorLog  ${APACHE_LOG_DIR}/sandbox.erp-dev.findair.it-error.log
    CustomLog ${APACHE_LOG_DIR}/sandbox.erp-dev.findair.it-access.log combined
</VirtualHost>

# ---------- HTTPS ----------
<VirtualHost *:443>
    ServerName sandbox.erp-dev.findair.it
    ServerAdmin webmaster@findair.it

    DocumentRoot /var/www/sandbox/dev/erp_findair_dev/web/dist

    # SPA: cualquier ruta que no sea un fichero cae en index.html (history mode).
    <Directory /var/www/sandbox/dev/erp_findair_dev/web/dist>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
        FallbackResource /index.html
    </Directory>

    # Los estáticos que no existen deben dar 404 (no el index.html del fallback de la SPA).
    <Location "/assets">
        FallbackResource disabled
    </Location>

    # Logos de partner: partner_logo_url = /loghi_partner/logo_<id>.<ext>. Sin
    # este Alias caia en el fallback de la SPA y la barra mostraba el cubo TMWE.
    Alias /loghi_partner /var/www/sandbox/dev/api_dev/storage/loghi_partner
    <Directory /var/www/sandbox/dev/api_dev/storage/loghi_partner>
        Options None
        AllowOverride None
        FallbackResource disabled
        Require all denied
        <FilesMatch "^logo_[0-9]+\.(svg|png|jpe?g|gif)$">
            Require all granted
        </FilesMatch>
        Header set Cache-Control "public, max-age=3600"
        Header set Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src data:; sandbox"
        Header set X-Content-Type-Options "nosniff"
    </Directory>

    # BFF: solo se publica bff/public (nunca .env, src/ ni vendor/).
    Alias /bff /var/www/sandbox/dev/erp_findair_dev/bff/public
    <Directory /var/www/sandbox/dev/erp_findair_dev/bff/public>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
        FallbackResource /bff/index.php
    </Directory>

    # PHP-FPM 8.4, con flushpackets para no romper las SSE del manifiesto
    # (mod_proxy_fcgi bufferiza la respuesta hasta que el script termina).
    <Proxy "unix:/run/php/php8.4-fpm.sock|fcgi://localhost-erp-findair">
        ProxySet flushpackets=on
    </Proxy>
    <FilesMatch \.php$>
        SetHandler "proxy:fcgi://localhost-erp-findair"
    </FilesMatch>

    # Sin buffering para los streams SSE del manifiesto (response: stream).
    <Location "/bff/v1">
        SetEnv no-gzip 1
    </Location>

    ErrorLog  ${APACHE_LOG_DIR}/sandbox.erp-dev.findair.it-error.log
    CustomLog ${APACHE_LOG_DIR}/sandbox.erp-dev.findair.it-access.log combined

    # SSL - Let's Encrypt
    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/sandbox.erp-dev.findair.it/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/sandbox.erp-dev.findair.it/privkey.pem
</VirtualHost>
